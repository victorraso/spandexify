<hr class="horizontal-line">
<div class="play-controls">
    <div class="create-playlist">
        <button class="create-play-btn btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#create-playlist-modal"><i class="bi bi-folder-plus"></i>Create New Playlist</button>
    </div>
    <!-- create playlist modal -->
    <div class="modal" tabindex="-1" id="create-playlist-modal">
        <div class="modal-dialog">
          <div class="modal-content bg-dark text-white">
            <div class="modal-header">
              <h5 class="modal-title">Create New Playlist</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <label for="playlist-input-name" class="form-label"></label>
              <input type="text" class="form-control" id="playlist-input-name" placeholder="Playlist Name...">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="approve-playlist-btn btn btn-success">Create</button>
            </div>
          </div>
        </div>
      </div>
    <div class="delete-playlist">
        <button class="delete-play-btn btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#delete-playlist-modal"><i class="bi bi-folder-minus"></i>Delete Playlist</button>
    </div>
    <!-- delete playlist modal -->
    <div class="modal" tabindex="-1" id="delete-playlist-modal">
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header">
            <h5 class="modal-title">Delete Playlist</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="confirm-delete-btn btn btn-success">Delete</button>
          </div>
        </div>
      </div>
    </div>
</div>
