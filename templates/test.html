<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Top 5 Songs Accordion</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #222;
            color: white;
        }

        .accordion-button {
            background-color: #333;
            color: white;
        }

        .accordion-button:focus,
        .accordion-button:not(.collapsed) {
            background-color: #444;
            color: lime;
        }

        .list-group-item {
            background-color: #111;
            color: white;
        }

        .list-group-item:hover {
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="accordion" id="bandAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#topSongs">
                        🎸 Top 5 Songs - Guns N' Roses
                    </button>
                </h2>
                <div id="topSongs" class="accordion-collapse collapse" data-bs-parent="#bandAccordion">
                    <div class="accordion-body">
                        <ul class="list-group">
                            <li class="list-group-item">1. Sweet Child O' Mine</li>
                            <li class="list-group-item">2. Welcome to the Jungle</li>
                            <li class="list-group-item">3. November Rain</li>
                            <li class="list-group-item">4. Paradise City</li>
                            <li class="list-group-item">5. Don't Cry</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
