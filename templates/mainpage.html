<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="../static/css/bootstrap.css" rel="stylesheet">
    <link href="../static/css/mainpage.css" rel="stylesheet">
    <link href="../static/css/band-alpha-list.css" rel="stylesheet">
    <link href="../static/css/albums.css" rel="stylesheet">
    <link href="../static/css/bio.css" rel="stylesheet">
    <link href="../static/css/favorites.css" rel="stylesheet">
    <link href="../static/css/playlists.css" rel="stylesheet">
    <link href="../static/css/search-results.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <title>Spandexify</title>
</head>
<body>
    <div class="full-page-container">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                  <a id="nav-brand-btn" class="navbar-brand" href="#">Spandexify</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <ul class="navbar-nav">
                      <li class="nav-item">
                          <a class="nav-link pt-3 d-block d-lg-none">: : Hello, {{ session['user_username'] }} : :</a>
                      </li>                     
                    </ul>
                    <div class="navbar-nav">
                      <a id="nav-bands-btn" class="nav-link active no-link-820" aria-current="page" href="#">Bands List</a>
                      <a id="nav-fav-btn" class="nav-link no-link-820" aria-current="page" href="#">Favorites</a>
                      <a id="nav-play-btn" class="nav-link no-link-820" href="#">Playlists</a>
                    </div>
                    <ul class="navbar-nav ms-auto">
                      <li class="nav-item">
                          <a class="nav-link d-none d-lg-block">: : Hello, {{ session['user_username'] }} : :</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link" id="logoutlink" href="{{ url_for('user_logout') }}">Log Out</a>
                      </li>                          
                    </ul>
                  </div>
                </div>
              </nav>
        </header>
        <main>
            <div class="main-container">
                <div id="lookup" class="custom-scrollbar lookup-container">
                  <div class="lookup-inner-container">
                    <div class="lookup-header">
                      <div class="deep-search input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control" type="text" placeholder="Search" aria-label="Search">
                      </div>
                      <div class="alpha-search">
                        <span class="alpha-letters">A</span>
                        <span class="alpha-letters">B</span>
                        <span class="alpha-letters">C</span>
                        <span class="alpha-letters">D</span>
                        <span class="alpha-letters">E</span>
                        <span class="alpha-letters">F</span>
                        <span class="alpha-letters">G</span>
                        <span class="alpha-letters">H</span>
                        <span class="alpha-letters">I</span>
                        <span class="alpha-letters">J</span>
                        <span class="alpha-letters">K</span>
                        <span class="alpha-letters">L</span>
                        <span class="alpha-letters">M</span>
                        <span class="alpha-letters">N</span>
                        <span class="alpha-letters">O</span>
                        <span class="alpha-letters">P</span>
                        <span class="alpha-letters">Q</span>
                        <span class="alpha-letters">R</span>
                        <span class="alpha-letters">S</span>
                        <span class="alpha-letters">T</span>
                        <span class="alpha-letters">U</span>
                        <span class="alpha-letters">V</span>
                        <span class="alpha-letters">X</span>
                        <span class="alpha-letters">Y</span>
                        <span class="alpha-letters">Z</span>
                      </div>
                      <hr class="horizontal-line">
                    </div>
                    <div id='content' class="lookup-content default-link" data-url="/band-alpha-list">
                      
                    </div>
                  </div>
                </div>
                <div id="handle" class="resize-handle" ></div>
                <div id="favs-play-container" class="custom-scrollbar favs-container" data-url="/favs-play">
                  <div class="favs-play-header">
                      <button class="favorites-btn btn btn-success"><i class="bi bi-heart-fill"></i>Favorites</button>
                      <button class="playlists-btn btn btn-success"><i class="bi bi-music-note-list"></i>Playlists</button>
                  </div>
                  <div id="favs-play" class="favs-play-content">
              
                  </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../static/js/bootstrap.bundle.js"></script>
    <script src="../static/js/mainpage.js"></script>
    <script src="../static/js/band-alpha-list.js"></script>
    <script src="../static/js/albums.js"></script>
    <script src="../static/js/bio.js"></script>
    <script src="../static/js/favorites.js"></script>
    <script src="../static/js/playlists.js"></script>
    <script src="../static/js/search-results.js"></script>

</body>
</html>
